<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario · Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">📦</span>
      <div>
        <h1>Inventario</h1>
        <p class="brand-sub">Gestión de productos y stock</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="lastUpdate" class="muted">—</span>
      <button id="btnRefrescar" class="btn btn-ghost" type="button">↻ Refrescar</button>
    </div>
  </header>

  <main class="container">
    <section class="metrics" aria-label="Métricas">
      <article class="metric-card">
        <span class="metric-label">Total productos</span>
        <span id="mTotal" class="metric-value">0</span>
      </article>
      <article class="metric-card metric-warn">
        <span class="metric-label">Stock bajo</span>
        <span id="mBajo" class="metric-value">0</span>
      </article>
      <article class="metric-card metric-ok">
        <span class="metric-label">Valor del inventario</span>
        <span id="mValor" class="metric-value">$0</span>
      </article>
    </section>

    <section class="content-grid">
      <div class="panel table-panel">
        <div class="panel-header">
          <h2>Productos</h2>
          <div class="toolbar">
            <input id="search" type="search" placeholder="Buscar por nombre…" aria-label="Buscar producto" />
            <button id="btnNuevo" class="btn btn-primary" type="button">+ Nuevo producto</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Stock</th>
                <th>Mínimo</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaBody"></tbody>
          </table>
        </div>
        <p id="emptyState" class="empty" hidden>No hay productos. ¡Agrega el primero!</p>
      </div>

      <aside class="panel side-panel">
        <div class="panel-header">
          <h2>⚠ Stock bajo</h2>
        </div>
        <ul id="listaStockBajo" class="stock-list"></ul>
        <p id="emptyStock" class="empty" hidden>Todo el stock está OK.</p>
      </aside>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <h2 id="modalTitle">Nuevo producto</h2>
        <button class="btn btn-ghost" data-close type="button" aria-label="Cerrar">✕</button>
      </header>
      <form id="formProducto" class="modal-body">
        <input type="hidden" id="fId" />
        <label>
          <span>Nombre *</span>
          <input id="fNombre" type="text" required maxlength="120" placeholder="Ej. Teclado mecánico" />
        </label>
        <label>
          <span>Descripción</span>
          <textarea id="fDescripcion" rows="2" placeholder="Opcional"></textarea>
        </label>
        <div class="form-row">
          <label>
            <span>Stock</span>
            <input id="fStock" type="number" min="0" step="1" value="0" />
          </label>
          <label>
            <span>Stock mínimo</span>
            <input id="fStockMinimo" type="number" min="0" step="1" value="0" />
          </label>
          <label>
            <span>Precio</span>
            <input id="fPrecio" type="number" min="0" step="0.01" value="0" />
          </label>
        </div>
        <footer class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </footer>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
